# =============================================================================
# CONFIGURACIÓN DE SONARQUBE
# =============================================================================
# Este archivo define los parámetros que SonarQube utilizará para analizar
# la calidad del código fuente del proyecto. SonarQube inspecciona el código
# en busca de bugs, vulnerabilidades de seguridad, code smells (malas
# prácticas) y mide la cobertura de pruebas.
#
# Documentación oficial: https://docs.sonarsource.com/sonarqube/
# =============================================================================


# -----------------------------------------------------------------------------
# IDENTIFICACIÓN DEL PROYECTO
# -----------------------------------------------------------------------------
# SonarQube necesita un identificador único para cada proyecto. Estos valores
# se muestran en el dashboard de SonarQube y permiten asociar los resultados
# del análisis con el proyecto correcto.
#
# projectKey:    Identificador único interno (no puede repetirse en el servidor).
# projectName:   Nombre legible que aparece en la interfaz de usuario.
# projectVersion: Versión del proyecto que se está analizando.
sonar.projectKey=fastapi-modern-toolchain-template
sonar.projectName=fastapi-modern-toolchain-template
sonar.projectVersion=0.1.0


# -----------------------------------------------------------------------------
# DIRECTORIOS DEL CÓDIGO FUENTE Y PRUEBAS
# -----------------------------------------------------------------------------
# Se le indica a SonarQube dónde está el código a analizar (sources) y dónde
# están los tests (tests). Esto permite que SonarQube evalúe la calidad del
# código de la aplicación y, por separado, verifique que los tests existen.
#
# sources:  Ruta(s) del código fuente de la aplicación.
# tests:    Ruta(s) donde se encuentran los archivos de prueba.
sonar.sources=app
sonar.tests=tests


# -----------------------------------------------------------------------------
# LENGUAJE Y CODIFICACIÓN
# -----------------------------------------------------------------------------
# language:       Código del lenguaje de programación ("py" para Python).
# sourceEncoding: Codificación de caracteres de los archivos fuente (UTF-8
#                 es el estándar recomendado para proyectos modernos).
sonar.language=py
sonar.sourceEncoding=UTF-8


# -----------------------------------------------------------------------------
# EXCLUSIONES
# -----------------------------------------------------------------------------
# Patrones de archivos y directorios que SonarQube debe IGNORAR durante el
# análisis. Esto evita ruido en los reportes y excluye carpetas que no
# contienen código de la aplicación (como entornos virtuales, cachés, etc.).
sonar.exclusions=**/tests/**,**/__pycache__/**,**/.venv/**,**/venv/**


# -----------------------------------------------------------------------------
# REPORTE DE COBERTURA DE PRUEBAS
# -----------------------------------------------------------------------------
# Ruta al archivo XML generado por la herramienta coverage.py (a través de
# pytest-cov). SonarQube leerá este archivo para mostrar el porcentaje de
# código cubierto por las pruebas automatizadas.
#
# El archivo coverage.xml se genera automáticamente al ejecutar:
#   pytest --cov=app --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml


# -----------------------------------------------------------------------------
# SERVIDOR SONARQUBE
# -----------------------------------------------------------------------------
# Dirección URL del servidor SonarQube al que se enviarán los resultados del
# análisis. En entornos de desarrollo local suele apuntar a localhost:9000.
sonar.host.url=http://localhost:9000